name: foundation-ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go module integrity and tidy state
        env:
          GOTOOLCHAIN: local
        run: |
          go mod verify
          go mod tidy -diff
      - name: Formatting
        run: |
          gofmt -l cmd internal | tee /tmp/unformatted-go
          test ! -s /tmp/unformatted-go
      - name: Vet
        run: go vet ./...
      - name: Tests, race detector
        run: go test -race -count=1 ./...
      - name: Compile
        run: go build -o /tmp/delta-control-api ./cmd/control-api

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/control-ui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject floating UI dependency versions
        run: node scripts/check-dependency-pins.mjs
      - name: Install UI dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Audit runtime UI dependencies for high severity advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Validate strategy JSON Schema and examples
        run: npm run validate:schema
      - name: Type-check and build
        run: npm run build
      - name: Browser viewport and keyboard-readiness smoke
        run: |
          npm run preview -- --port 4173 --strictPort > /tmp/delta-ui-preview.log 2>&1 &
          node scripts/browser-smoke.mjs
      - name: Upload UI viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-ui-viewport-screenshots
          path: apps/control-ui/browser-screenshots/*.png
          if-no-files-found: warn
