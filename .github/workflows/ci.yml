name: foundation-ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Formatting
        run: |
          gofmt -l cmd internal | tee /tmp/unformatted-go
          test ! -s /tmp/unformatted-go
      - name: Vet
        run: go vet ./...
      - name: Tests, race detector
        run: go test -race -count=1 ./...
      - name: Compile
        run: go build -o /tmp/delta-control-api ./cmd/control-api

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/control-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject floating UI dependency versions
        run: node scripts/check-dependency-pins.mjs
      - name: Install UI dependencies from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Validate strategy JSON Schema and examples
        run: npm run validate:schema
      - name: Type-check and build
        run: npm run build
